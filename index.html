<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOM Search Tool</title>
<style>:root{--b:#145c96;--p:#eef5fb;--d:#c7d6e3;--t:#17212b;--r:#b3261e}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--t);font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif}header{padding:16px 24px;background:#0c4778;color:#fff}header h1{margin:0 0 4px;font-size:19px}header p{margin:0;color:rgba(255,255,255,.75);font-size:13px}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--d);border-radius:10px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select{width:100%;padding:8px;border:1px solid #aebdca;border-radius:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:6px;padding:8px 14px;font-weight:600;background:var(--b);color:white;cursor:pointer}button.secondary{background:#e8eef4;color:#18344d}button:disabled{opacity:.5}.status{margin-top:12px;padding:10px;background:var(--p);border-radius:6px}.ok{color:#137333}.error{color:var(--r)}.help{font-size:13px;color:#5f6b76;margin:8px 0}.hidden{display:none}.resultsHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.resultsHead h2{margin:0}.resultsHead .actions{margin-top:0}.tablewrap{overflow:auto;max-height:540px;margin-top:12px;border:1px solid var(--d);border-radius:7px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #dde5ec;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#e9f2fa}tbody tr:nth-child(even){background:#f7f9fb}.desc{white-space:normal;min-width:360px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>BOM Search Tool</h1><p>Offline tool with phrase and AND-expression searching</p></header><main>
<section class="card"><div class="grid">
<div class="field"><label>Excel or CSV BOM</label><input id="file" type="file" accept=".xlsx,.xls,.xlsb,.csv,.txt"></div>
<div class="field"><label>Search for</label><select id="keyword" disabled><option>Choose a file first</option></select></div></div>
<div class="actions"><button id="search" disabled>Search BOM</button><button id="clear" class="secondary">Clear Results</button></div><div id="status" class="status">Choose a BOM file. Processing stays on this computer.</div></section>
<section id="results" class="card hidden"><p id="context" class="help hidden"></p><div class="resultsHead"><div><h2>Results</h2><div id="summary" class="help"></div></div><div class="actions"><button id="xlsx">Download as Excel</button></div></div>
<div class="tablewrap"><table><thead><tr><th>Item Number</th><th>Description</th><th>Assembly</th><th>Quantity</th><th>Level</th><th>Row</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<script src="xlsx.full.min.js"></script><script>
'use strict';
const DEFAULTS={GFB:['AHU','Spray Pump => peristaltic','Blower','Scrubber => Wet Scrubber','Police Filter','Vacuum and Pump','Booster and Pump','Dosing Pump => metering','Winch and Motor'],HSG:['AHU','Blower','Vacuum and Pump','motor','Spray Pump => Peristaltic','Dosing Pump => metering','Air Filter => Filter Bag', 'AODD and PUMP', 'sight and glass'],Mills:[],Coater:['AHU','Spray Pump => peristaltic','Dosing Pump => metering','de duster and Duster','booster and pump','Solution and Tank','valve and dessicant']};
const MACHINES={'7-100':'GFB','7-230':'HSG','7-260':'Mills','7-700':'Coater'};
const PURCHASE_PREFIXES=['7-999-','7-972-'];
const $=x=>document.getElementById(x);let wb=null,fileName='',found=[],currentMachine='';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ruleParts(rule){let parts=String(rule).split(/\s*=>\s*/,2),label=parts[0].trim(),expression=(parts[1]||parts[0]).trim();return {label,expression}}
function status(s,c=''){$('status').textContent=s;$('status').className='status '+c}
const norm=v=>String(v??'').trim();const headerKey=v=>norm(v).toLowerCase().replace(/[._\-\s]+/g,' ').trim();const textKey=v=>norm(v).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function isPurchasedItem(item){let low=item.toLowerCase();return PURCHASE_PREFIXES.some(p=>low.startsWith(p))}
function findHeader(rows){let best={row:-1,item:-1,desc:-1,qty:-1,level:-1,total:-1,score:-1};for(let r=0;r<Math.min(rows.length,120);r++){let v=rows[r].map(headerKey),desc=v.findIndex(x=>x==='description'||x.includes('description')),item=v.findIndex((x,i)=>i!==desc&&(x==='no'||x==='item no'||x==='item number'||x==='item'||x.includes('item number'))),qty=v.findIndex(x=>x==='bom quantity'||x.includes('bom quantity')||x==='quantity'||x==='qty'),level=v.findIndex(x=>x==='level no'||x==='level'||x.includes('level no')),total=v.findIndex(x=>x==='total quantity'||x.includes('total quantity')),score=(item>=0?3:0)+(desc>=0?3:0)+(qty>=0?1:0)+(level>=0?1:0)+(total>=0?1:0);if(item>=0&&desc>=0&&score>best.score)best={row:r,item,desc,qty,level,total,score}}return best}
function isTreeRow(row,h){return /^\s*\d+\s*$/.test(String(row[h.level]??''))}
function buildContext(rows,h){let ctx=new Array(rows.length).fill(null);if(h.level<0)return ctx;let stack=[];for(let r=h.row+1;r<rows.length;r++){let row=rows[r];if(!isTreeRow(row,h))continue;let lvl=parseInt(String(row[h.level]).trim(),10);while(stack.length&&stack[stack.length-1].level>=lvl)stack.pop();let parentMult=stack.length?stack[stack.length-1].mult:1;let localQty=parseFloat(row[h.qty]);if(!isFinite(localQty))localQty=1;let mult=parentMult*localQty;let parentPath=stack.map(s=>({item:s.item,desc:s.desc}));ctx[r]={level:lvl,mult,parentPath};stack.push({level:lvl,mult,item:norm(row[h.item]),desc:norm(row[h.desc])})}return ctx}
function findTopItem(rows,h){for(let r=0;r<h.row;r++){let v=rows[r][0],m=v&&String(v).match(/Item:\s*Item No\.?:\s*(.+)/i);if(m){let topNo=m[1].trim();for(let rr=h.row+1;rr<rows.length;rr++){if(norm(rows[rr][h.item])===topNo)return{item:topNo,desc:norm(rows[rr][h.desc])};if(norm(rows[rr][0])===topNo)return{item:topNo,desc:norm(rows[rr][h.item])}}return{item:topNo,desc:''}}}return null}
function extractTag(text,tag){return text.match(new RegExp(tag+'\\s*[:_-]?\\s*(\\d+)','i'))}
function parseTopDesc(desc){let d=desc,spnM=extractTag(d,'SPN'),spn=spnM?spnM[1]:'';if(spnM)d=d.slice(0,spnM.index)+d.slice(spnM.index+spnM[0].length);let pnM=extractTag(d,'PN'),pn=pnM?pnM[1]:'';if(pnM)d=d.slice(0,pnM.index)+d.slice(pnM.index+pnM[0].length);let type=d.replace(/_/g,' ').replace(/\s+/g,' ').trim();return{spn,pn,type}}
function expressionMatches(description,expression){let d=textKey(description);if(!d)return false;if(/\s+AND\s+/i.test(expression)){return expression.split(/\s+AND\s+/i).map(textKey).filter(Boolean).every(term=>d.includes(term))}return d.includes(textKey(expression))}
function match(description,machine,selected){let list=selected==='__ALL__'?(DEFAULTS[machine]||[]):[(DEFAULTS[machine]||[])[Number(selected)]].filter(Boolean);let rule=list.find(x=>expressionMatches(description,ruleParts(x).expression));return rule?ruleParts(rule):null}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('context').classList.add('hidden');$('keyword').innerHTML='<option>Loading…</option>';$('keyword').disabled=true;$('search').disabled=true;currentMachine='';try{fileName=f.name;wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});let sn=wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true}),h=findHeader(rows);if(h.row<0){wb=null;$('keyword').innerHTML='<option>Choose a file first</option>';return status('Could not find a row containing No. and Description.','error')}let top=findTopItem(rows,h);if(!top){wb=null;$('keyword').innerHTML='<option>Choose a file first</option>';return status('Could not find the top-level item ("Item: Item No.:" row).','error')}let prefix=top.item.split('-').slice(0,2).join('-'),machine=MACHINES[prefix];if(!machine){wb=null;$('keyword').innerHTML='<option>Choose a file first</option>';return status(`Unrecognized item-number prefix "${prefix}" on top item ${top.item} — expected 7-100 (GFB), 7-230 (HSG), 7-260 (Mills) or 7-700 (Coater).`,'error')}currentMachine=machine;let parsed=parseTopDesc(top.desc);$('context').textContent=`${machine} · SPN ${parsed.spn||'—'} · PN ${parsed.pn||'—'} · ${top.item} · ${parsed.type}`;$('context').classList.remove('hidden');$('keyword').innerHTML='<option value="__ALL__">All Keywords</option>'+(DEFAULTS[machine]||[]).map((x,i)=>`<option value="${i}">${esc(ruleParts(x).label)}</option>`).join('');$('keyword').disabled=false;$('search').disabled=false;status(`Loaded ${f.name}.`,'ok')}catch(err){wb=null;$('keyword').innerHTML='<option>Choose a file first</option>';status('Could not read file: '+err.message,'error')}};
$('search').onclick=()=>{let sn=wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true}),h=findHeader(rows);if(h.row<0)return status('Could not find a row containing No. and Description.','error');let m=currentMachine,k=$('keyword').value,ctx=buildContext(rows,h);found=[];for(let r=h.row+1;r<rows.length;r++){let row=rows[r],item=norm(row[h.item]),desc=norm(row[h.desc]);if(!isPurchasedItem(item))continue;let hit=match(desc,m,k);if(!hit)continue;let c=ctx[r],quantity=h.total>=0?norm(row[h.total]):(c?String(Math.round(c.mult*1e6)/1e6):(h.qty>=0?norm(row[h.qty]):'')),assembly=c&&c.parentPath.length?c.parentPath[0].desc:(c?desc:''),assemblyPath=c&&c.parentPath.length?c.parentPath.map(x=>x.desc).join(' › '):'';found.push({machine:m,label:hit.label,expression:hit.expression,item,description:desc,assembly,assemblyPath,quantity,level:h.level>=0?norm(row[h.level]):'',sheet:sn,row:r+1})}render();let note=h.total>=0?' (quantities from the Total Quantity column)':(h.level>=0?' (quantities rolled up via BOM Level)':'');status(`Header found at row ${h.row+1}. ${found.length} matching row(s)${note}.`,'ok')};
function render(){$('results').classList.remove('hidden');$('summary').textContent=`${found.length} match(es) in ${fileName}`;$('body').innerHTML=found.map(x=>`<tr><td>${esc(x.item)}</td><td class="desc">${esc(x.description)}</td><td title="${esc(x.assemblyPath)}">${esc(x.assembly)}</td><td>${esc(x.quantity)}</td><td>${esc(x.level)}</td><td>${x.row}</td></tr>`).join('')}
$('clear').onclick=()=>{found=[];$('results').classList.add('hidden');status(wb?'Results cleared. BOM remains loaded.':'Choose a BOM file.')};
function rowsOut(){return found.map(x=>({'Machine':x.machine,'Search Parameter':x.label,'Search Expression':x.expression,'Item Number':x.item,'Description':x.description,'Assembly':x.assembly,'Assembly Path':x.assemblyPath,'Quantity':x.quantity,'Level':x.level,'Source Sheet':x.sheet,'Source Row':x.row}))}function outName(){return `${currentMachine}_${$('keyword').selectedOptions[0].text.replace(/\s+/g,'_')}_BOM_Results`}
$('xlsx').onclick=()=>{let d=rowsOut();if(!d.length)return alert('No results to download.');let ws=XLSX.utils.json_to_sheet(d),o=XLSX.utils.book_new();XLSX.utils.book_append_sheet(o,ws,'Search Results');XLSX.writeFile(o,outName()+'.xlsx')};
if(typeof XLSX==='undefined')status('xlsx.full.min.js is missing. Keep it beside this HTML file.','error');
</script></body></html>
